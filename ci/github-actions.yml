name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest black isort ruff

      - name: Lint & tests
        run: |
          black --check .
          isort --check-only .
          ruff .
          pytest -q

      - name: DagBag check
        run: |
          python - <<'PY'
          from airflow.models import DagBag
          db = DagBag(dag_folder="dags", include_examples=False)
          assert len(db.import_errors) == 0, db.import_errors
          PY

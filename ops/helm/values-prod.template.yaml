# ops/helm/values-prod.template.yaml
# Render this with ops/tools/render_values.py or manually replace tokens.

namespace: "{{NAMESPACE}}"

executor: KubernetesExecutor

image:
  repository: "{{IMAGE_REPO}}"      # e.g., ghcr.io/Paulobenicpv/Airflow
  tag: "{{IMAGE_TAG}}"              # e.g., latest or a git SHA/tag
  pullPolicy: IfNotPresent

env:
  - name: AIRFLOW__CORE__EXECUTOR
    value: KubernetesExecutor
  - name: AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION
    value: "false"
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "false"

# Secrets Backend (Azure Key Vault)
extraEnv:
  - name: AIRFLOW__SECRETS__BACKEND
    value: airflow.providers.microsoft.azure.secrets.key_vault.AzureKeyVaultBackend
  - name: AIRFLOW__SECRETS__BACKEND_KWARGS
    value: '{"connections_path":"airflow-connections","variables_path":"airflow-variables","vault_url":"{{VAULT_URL}}"}'

# Mount Azure credentials from a Kubernetes Secret named 'airflow-azure'
extraEnvFrom:
  - secretRef:
      name: airflow-azure

resources:
  limits:
    cpu: "2"
    memory: "2Gi"
  requests:
    cpu: "300m"
    memory: "768Mi"

# Webserver service type
webserver:
  service:
    type: ClusterIP
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow-init:
    image: apache/airflow:2.9.3
    env_file:
      - ../../.env
    depends_on:
      - postgres
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --role Admin --username admin --password admin --firstname Admin --lastname User --email admin@example.com || true"
    volumes:
      - ../../dags:/opt/airflow/dags
      - ../../plugins:/opt/airflow/plugins
      - ../../include:/opt/airflow/include
      - ../../requirements.txt:/opt/airflow/requirements.txt

  scheduler:
    image: apache/airflow:2.9.3
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    volumes:
      - ../../dags:/opt/airflow/dags
      - ../../plugins:/opt/airflow/plugins
      - ../../include:/opt/airflow/include
      - ../../requirements.txt:/opt/airflow/requirements.txt
    command: scheduler

  webserver:
    image: apache/airflow:2.9.3
    env_file:
      - ../../.env
    depends_on:
      postgres:
        condition: service_healthy
      scheduler:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ../../dags:/opt/airflow/dags
      - ../../plugins:/opt/airflow/plugins
      - ../../include:/opt/airflow/include
      - ../../requirements.txt:/opt/airflow/requirements.txt
    command: webserver

volumes:
  pg_data:
